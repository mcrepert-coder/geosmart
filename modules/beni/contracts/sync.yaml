# Genere depuis le code M4 par tools/generate-contract.cjs
openapi: 3.1.0
info:
  title: GeoSmart M4 - sync
  version: 0.2.0
  description: Comptes, roles, carte et synchronisation. Module independant.
    Synchronisation de missions completes ; contrat metier de mission a
    confirmer.
servers:
  - url: http://127.0.0.1:3000
    description: Demonstration locale
paths:
  /sync:
    post:
      summary: Synchroniser des missions completes
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Succes
          content:
            application/json:
              schema:
                type: object
                required:
                  - results
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required:
                        - clientId
                        - status
                        - retryable
                      properties:
                        clientId:
                          type: string
                          format: uuid
                        status:
                          enum:
                            - accepted
                            - rejected
                        entityId:
                          type: string
                        reason:
                          type: string
                        retryable:
                          type: boolean
        "400":
          description: Donnees invalides
        "401":
          description: Authentification absente ou invalide
        "403":
          description: Compte ou role non autorise
        "429":
          description: "Limite par IP : 120 requetes par minute"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  minItems: 1
                  maxItems: 100
                  type: array
                  items:
                    type: object
                    properties:
                      clientId:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      entityType:
                        type: string
                        const: survey_session
                      payload:
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties: {}
                    required:
                      - clientId
                      - entityType
                      - payload
                    additionalProperties: false
              required:
                - items
              additionalProperties: false
      description: "Un element entityType=survey_session contient la mission entiere.
        Aucun envoi borne par borne. Le schema metier payload, la revision de
        mission et la conversion en parcelle sont a valider avec Romuald et le
        module foncier : le schema demo-v1 ne vaut pas contrat commun. POST
        /sync ne cree aucune parcelle. Les routes, contraintes et reponses de
        POST /parcels existantes restent du ressort de land.yaml. clientId
        unique par compte, renvoi identique idempotent, CLIENT_ID_REUSED si
        charge differente. SURVEY_ADAPTER_NOT_CONFIGURED est temporaire. Voir
        COMPATIBILITE-EQUIPE.md."
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Role:
      type: string
      enum:
        - ADMIN
        - GEOMETRE
        - TOPOGRAPHE
        - AGENT_IMMOBILIER
        - CLIENT
    CurrentUser:
      type: object
      required:
        - id
        - phone
        - name
        - role
        - certified
        - registeredSurveyor
        - accountActive
        - status
        - verified
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        name:
          type: string
        fullName:
          type: string
          maxLength: 120
        ordreNumber:
          type: string
          maxLength: 40
          description: geometre inscrit a l'Ordre
        role:
          $ref: "#/components/schemas/Role"
        certified:
          type: boolean
        registeredSurveyor:
          type: boolean
        accountActive:
          type: boolean
        status:
          enum:
            - pending
            - active
            - rejected
            - suspended
        verified:
          type: boolean
    User:
      $ref: "#/components/schemas/CurrentUser"
    Session:
      type: object
      required:
        - accessToken
        - refreshToken
        - user
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/User"
    Document:
      type: object
      properties:
        id:
          type: string
        ownerId:
          type: string
        type:
          type: string
        mime:
          type: string
        createdAt:
          type: string
          format: date-time
    FeatureCollection:
      type: object
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                const: Feature
              geometry:
                type: object
                properties:
                  type:
                    type: string
                    const: Polygon
                  coordinates:
                    type: array
                    items:
                      type: array
                      items:
                        minItems: 2
                        type: array
                        items:
                          type: number
                required:
                  - type
                  - coordinates
                additionalProperties: false
              properties:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  label:
                    type: string
                required:
                  - id
                  - status
                  - label
                additionalProperties: {}
            required:
              - type
              - geometry
              - properties
            additionalProperties: false
        demo:
          type: boolean
      required:
        - type
        - features
      additionalProperties: false
