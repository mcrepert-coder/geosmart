openapi: 3.0.3
info:
  title: GeoSmart - module comptes et authentification (auth)
  version: 0.1.0
  description: |
    Proprietaire : Beni (AGLAMEY-SEGBEAYA Kanleto Beni).
    Concerne : tous les modules (authentification et roles), ainsi que l'administration
    des comptes et des pieces justificatives.

    Exigences reprises : EF-401 a EF-404, EF-407, RG-06.
    Le cahier des charges impose l'authentification par téléphone, mot de passe BCrypt, 
    ainsi que la validation des comptes et des rôles par un administrateur.

    En mode de développement (AUTH_DEV_MODE=true), l'en-tête "Authorization: Bearer dev:<ROLE>[:<id>]" 
    permet également de simuler un utilisateur de test.

  x-team-decisions:
    - id: auth-paths
      question: Chemins et methodes HTTP valides pour l'authentification et l'administration.
    - id: login-credential
      question: Utilisation du telephone et du mot de passe chiffre par BCrypt.
    - id: token-lifecycle
      question: Fixer les durees des jetons (acces court 1h, renouvellement 30 jours).
    - id: account-transitions
      question: Gestion des etats et des preconditions de validation, rejet et suspension.
    - id: document-requirements
      question: Verification des documents obligatoires selon le role et attribution par l'admin.

servers:
  - url: http://localhost:3001

tags:
  - name: inscription
  - name: authentification
  - name: pieces-justificatives
  - name: administration

paths:
  /auth/registrations:
    post:
      tags: [inscription]
      summary: Creer un compte et initier la verification du telephone
      description: |
        Cree une demande sans role choisi par le demandeur et declenche l'envoi du code SMS.
        Le compte est a l'etat TELEPHONE_NON_VERIFIE.
      x-proposed-path: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: Compte cree, verification du telephone en attente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Validation'

  /auth/phone-verifications:
    post:
      tags: [inscription]
      summary: Verifier le numero de telephone avec le code SMS
      description: Un code valide fait passer le compte a l'etat EN_ATTENTE.
      x-proposed-path: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneVerificationRequest'
      responses:
        '200':
          description: Telephone verifie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Validation'

  /auth/login:
    post:
      tags: [authentification]
      summary: Connexion par telephone et mot de passe
      description: |
        Ouvre une session avec le téléphone et le mot de passe hashé (BCrypt).
        Cinq echecs de connexion entrainent un blocage temporaire de 15 minutes.
      x-proposed-path: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone:
                  type: string
                  example: '+228 90 00 00 00'
                password:
                  type: string
                  format: password
                  writeOnly: true
      responses:
        '200':
          description: Session ouverte (Jetons d'acces et de renouvellement)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/Validation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Compte en attente de validation ou suspendu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: Connexion temporairement bloquee apres cinq echecs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: LOGIN_TEMPORARILY_BLOCKED
                message: Connexion temporairement bloquee.
                details:
                  lockedUntil: '2026-10-30T15:30:00Z'

  /auth/tokens/refresh:
    post:
      tags: [authentification]
      summary: Renouveller les jetons
      description: Renouvelle le jeton d'accès à partir du jeton de renouvellement.
      x-proposed-path: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      responses:
        '200':
          description: Jetons renouveles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/Validation'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [authentification]
      summary: Utilisateur connecte, role relu en base (RG-06)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Utilisateur connecte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /accounts/me/documents:
    get:
      tags: [pieces-justificatives]
      summary: Lister les pieces justificatives du compte courant
      description: Un utilisateur ne consulte que les pieces de son propre compte.
      x-proposed-path: true
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pieces justificatives du compte courant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [pieces-justificatives]
      summary: Deposer une piece justificative
      description: Les documents admis font au maximum 5 Mo et sont au format JPEG, PNG ou PDF.
      x-proposed-path: true
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUpload'
      responses:
        '201':
          description: Piece justificative deposee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentMetadata'
        '400':
          $ref: '#/components/responses/Validation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  /accounts/me/documents/{documentId}/content:
    get:
      tags: [pieces-justificatives]
      summary: Telecharger une de ses pieces justificatives
      x-proposed-path: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Contenu prive de la piece
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/accounts:
    get:
      tags: [administration]
      summary: Consulter la file des comptes
      description: Role ADMIN uniquement.
      x-proposed-path: true
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Comptes visibles dans la file d'administration
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [administration]
      summary: Consulter un compte et ses pieces justificatives
      description: Role ADMIN uniquement.
      x-proposed-path: true
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Compte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/accounts/{accountId}/documents:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [administration]
      summary: Lister les pieces justificatives d'un compte
      description: Role ADMIN uniquement.
      x-proposed-path: true
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pieces justificatives privees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/accounts/{accountId}/documents/{documentId}/content:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [administration]
      summary: Consulter le contenu prive d'une piece justificative
      description: Role ADMIN uniquement.
      x-proposed-path: true
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Contenu prive de la piece
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/accounts/{accountId}/validate:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [administration]
      summary: Valider un compte
      description: Role ADMIN uniquement.
      x-proposed-path: true
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Compte apres validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/accounts/{accountId}/reject:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [administration]
      summary: Rejeter un compte avec un motif
      description: Le motif de rejet est obligatoire. Role ADMIN.
      x-proposed-path: true
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRejection'
      responses:
        '200':
          description: Compte rejete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Validation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/accounts/{accountId}/suspend:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [administration]
      summary: Suspendre un compte
      description: Role ADMIN uniquement.
      x-proposed-path: true
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Compte suspendu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/accounts/{accountId}/role:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    put:
      tags: [administration]
      summary: Attribuer le role d'un compte
      description: Role ADMIN uniquement.
      x-proposed-path: true
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignment'
      responses:
        '200':
          description: Role attribue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Validation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Role:
      type: string
      enum: [ADMIN, GEOMETRE, TOPOGRAPHE, AGENT, CLIENT]

    AccountStatus:
      type: string
      description: Etats du compte definis dans le cahier des charges
      enum: [TELEPHONE_NON_VERIFIE, EN_ATTENTE, ACTIF, REJETE, SUSPENDU]

    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [phone, password]
      properties:
        phone:
          type: string
          description: Numero de telephone utilise pour la verification SMS
          example: '+228 90 00 00 00'
        password:
          type: string
          format: password
          description: Mot de passe utilisateur (hashé en BCrypt)

    PhoneVerificationRequest:
      type: object
      additionalProperties: false
      required: [phone, code]
      properties:
        phone:
          type: string
          example: '+228 90 00 00 00'
        code:
          type: string
          description: Code SMS recu par le titulaire du numero
          example: '123456'

    TokenRefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          writeOnly: true
          description: Jeton utilise pour demander le renouvellement des jetons

    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType]
      properties:
        accessToken:
          type: string
          description: Jeton signe de courte duree (1 h)
        refreshToken:
          type: string
          description: Jeton de renouvellement (30 jours)
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          minimum: 1
          description: Duree de validite du jeton d'acces en secondes

    CurrentUser:
      description: Forme de request.user lue par les gardes d'authentification
      type: object
      required: [id, role, registeredSurveyor, accountActive]
      properties:
        id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/Role' }
        registeredSurveyor: { type: boolean, description: "geometre inscrit a l'Ordre" }
        accountActive: { type: boolean, description: compte valide et actif }

    Account:
      type: object
      required: [id, phone, status, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        role:
          $ref: '#/components/schemas/Role'
          nullable: true
          description: Null tant qu'un administrateur n'a pas attribue de role
        rejectionReason:
          type: string
          nullable: true
          description: Motif fourni lors du rejet, le cas echeant
        documents:
          type: array
          description: Metadonnees privees visibles au titulaire et a l'administrateur
          items:
            $ref: '#/components/schemas/DocumentMetadata'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DocumentCategory:
      type: string
      description: Types de justificatifs cites dans EF-403
      enum: [IDENTITY, PROFESSIONAL_CARD, APPROVAL, RCCM, ORDER_REGISTRATION]

    DocumentUpload:
      type: object
      additionalProperties: false
      required: [category, file]
      properties:
        category:
          $ref: '#/components/schemas/DocumentCategory'
        file:
          type: string
          format: binary
          description: Fichier de 5 Mo maximum, au format JPEG, PNG ou PDF

    DocumentMetadata:
      type: object
      required: [id, category, contentType, sizeBytes, uploadedAt]
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/DocumentCategory'
        contentType:
          type: string
          enum: [image/jpeg, image/png, application/pdf]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 5242880
        uploadedAt:
          type: string
          format: date-time

    AccountRejection:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: Motif du rejet communique avec la decision

    RoleAssignment:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        fullName:
          type: string
          description: |
            Nom complet, imprime sur l'attestation de leve pour un geometre
            (demande du module foncier, issue #23).
        ordreNumber:
          type: string
          description: |
            Numero d'inscription a l'Ordre des geometres. Renseigne ce
            numero, un geometre devient registeredSurveyor (RG-03).

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
          description: Message lisible sans detail interne ni secret
        details:
          type: object

  responses:
    Validation:
      description: Donnees invalides
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: Les donnees fournies sont invalides.
    Unauthorized:
      description: Jeton absent, invalide ou identifiants invalides
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Authentification requise ou identifiants invalides.
    Forbidden:
      description: Role insuffisant pour effectuer cette action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: Action non autorisee pour votre role.
    NotFound:
      description: Compte ou piece justificative introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Ressource introuvable.
    PayloadTooLarge:
      description: Fichier superieur a la limite de 5 Mo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FILE_TOO_LARGE
            message: Le fichier depasse la taille maximale de 5 Mo.
    UnsupportedMediaType:
      description: Format de fichier non pris en charge
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNSUPPORTED_MEDIA_TYPE
            message: Seuls les formats JPEG, PNG et PDF sont acceptes.