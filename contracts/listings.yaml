openapi: 3.0.3
info:
  title: GeoSmart - module annonces et biens (listings)
  version: 0.1.0
  description: |
    Proprietaire : Marrich (KOUSSOUGBO Kokou Marrich, delegue et integrateur).
    Concerne : le site web public (web/, sauf web/parcelle/), l'application mobile
    (mobile/lib/features/listings/), et Beni (leasing consomme GET /properties/:id
    pour rattacher une visite a un bien).

    Exigences reprises du cahier des charges : EF-301 a EF-304 et EF-308, RG-05, CA-5, CA-6.
    - EF-301 : un bien (terrain ou maison) est rattache a une parcelle ; la publication est
      reservee aux agents immobiliers actifs.
    - EF-302 : badges "parcelle certifiee" et "agent certifie" visibles sur l'annonce.
    - EF-303 : recherche avec filtres (type, prix, statut juridique, badge, zone).
    - EF-304 : site web public (liste des annonces, fiche d'un bien, statut d'une parcelle).
    - EF-308 : partage WhatsApp (message pre-rempli) et TikTok / Instagram (lien + image).
    - RG-05 : un client ne publie jamais un bien ; il passe par un agent.
    - CA-5 : un client qui tente de publier un bien est refuse (403, "passez par un agent").
    - CA-6 : un agent publie un bien rattache a une parcelle certifiee ; le badge est visible,
      le bien apparait sur la carte (via la parcelle) et le lien de partage est public.

    Ce contrat fixe les routes et les champs du MVP Listings (decision Marrich du 2026-11-10).

    L'authentification s'appuie sur le bearer JWT de contracts/auth.yaml. Le role courant est
    relu en base a chaque requete (RG-06). Un "agent actif" est un compte de role AGENT dont
    accountActive = true (etat ACTIF). Toute ecriture (POST, PATCH) exige un agent actif ;
    un client recoit 403 et un compte suspendu recoit 403 mais peut encore lire.

    Le badge "parcelle certifiee" provient du statut courant de la parcelle
    (contracts/land.yaml, champ certified). Le badge "agent certifie" est une copie de
    l'etat fourni par Auth a la publication ; il est faux tant que Beni ne l'expose pas.
    Une nouvelle publication actualise cette copie ; un flux de revocation en temps reel
    reste a definir entre les modules.

    Aucune donnee personnelle de la parcelle (nom, telephone, coordonnees de bornes ou
    limites) n'est exposee ici. La carte ne recoit qu'un point indicatif arrondi a 0,01 degre
    (environ 1 km), jamais la geometrie. Les photos publiques sont stockees en PostgreSQL
    (bytea), JPEG/PNG, 5 Mio maximum ; les pieces d'identite restent privees (module auth).
    La mention "Ne vaut pas titre foncier" reste portee par la page parcelle.
  x-dependencies:
    authentication:
      contract: contracts/auth.yaml
      scheme: bearerAuth
      note: |
        Role relu en base a chaque requete (RG-06). "Agent actif" = role AGENT et
        accountActive = true. `contracts/auth.yaml` ne porte pas encore `agentCertified`;
        l'API enregistre false jusqu'a ce qu'Auth fournisse une valeur verifiable.
    land:
      contract: contracts/land.yaml
      endpoint: GET /parcels/:id/status
      note: |
        Un bien est rattache a une parcelle par son identifiant (parcelId, format TG-XXX-#####).
        Le badge "parcelle certifiee", le statut juridique et la surface sont lus depuis le
        statut courant de la parcelle. La carte Listings calcule un point indicatif arrondi
        depuis la geometrie interne ; elle ne renvoie ni polygone, ni limite, ni borne.
        Le lien web de verification est /parcelle?id=<parcelId>.
    leasing:
      contract: contracts/leasing.yaml
      endpoint: GET /properties/:id
      note: |
        Beni consomme cette route pour rattacher une visite a un bien. L'identifiant du bien
        est un UUID (propertyId). La forme de la reponse est fixee ci-dessous pour lever
        l'attente signalee dans contracts/leasing.yaml.
  x-cross-module-follow-up:
    owner: Beni
    contract: contracts/auth.yaml
    action: Ajouter `agentCertified` a `CurrentUser`, derive de la validation administrative
      des pieces professionnelles, et definir comment une revocation invalide les annonces.
      Listings garde le badge a false jusque-la.
  x-decisions:
    property-types: [TERRAIN, MAISON]
    transactions: [VENTE, LOCATION]
    currency: XOF
    rental-periods: [MOIS, AN]
    lifecycle:
      initial-status: BROUILLON
      publish: AGENT actif, parcelle existante et non EN_LITIGE
      republish: AGENT auteur actif, parcelle toujours non EN_LITIGE
      retire: AGENT auteur actif ou ADMIN actif
      public-visibility: PUBLIE seulement
    parcel-status: Relu en direct a chaque lecture, jamais copie dans la fiche.
    photo-storage: PostgreSQL bytea, maximum 5 MiB, JPEG/PNG verifies par signature.
      La premiere photo est principale ; les autres restent dans l'ordre d'ajout.
    sharing: WhatsApp recoit un message texte pre-rempli ; TikTok et Instagram recoivent
      un lien public et une image telechargeable, sans publication automatisee.
    pagination: page=1, pageSize=20 (maximum 100), tri recent par defaut.
    agent-contact: Aucun nom, telephone ou contact d'agent n'est expose publiquement
      avant validation d'une regle de consentement.

servers:
  - url: http://localhost:3001

tags:
  - name: biens
  - name: recherche
  - name: partage
  - name: photos

paths:
  /properties:
    get:
      tags: [recherche]
      summary: Rechercher et lister les biens publies (EF-303, EF-304)
      description: |
        Public. Ne renvoie que les biens PUBLIE. Filtres : type, transaction, prix, statut
        juridique de la parcelle, badge certifie, et zone. Aucune donnee personnelle.
      security: []
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/PropertyType' }
        - name: transaction
          in: query
          schema: { $ref: '#/components/schemas/TransactionType' }
        - name: priceMin
          in: query
          description: Prix minimum en FCFA (XOF).
          schema: { type: integer, minimum: 0 }
        - name: priceMax
          in: query
          description: Prix maximum en FCFA (XOF).
          schema: { type: integer, minimum: 0 }
        - name: legalStatus
          in: query
          description: Statut juridique de la parcelle rattachee (filtre EF-303).
          schema: { $ref: '#/components/schemas/LegalStatus' }
        - name: certified
          in: query
          description: Alias de parcelCertified, conserve pour compatibilite.
          schema: { type: boolean }
        - name: parcelCertified
          in: query
          description: Si true, ne renvoie que les biens dont la parcelle est certifiee.
          schema: { type: boolean }
        - name: agentCertified
          in: query
          description: Si true, ne renvoie que les biens dont l'agent est certifie.
          schema: { type: boolean }
        - name: zone
          in: query
          description: Quartier ou localite (recherche partielle).
          schema: { type: string, maxLength: 120 }
        - name: q
          in: query
          description: Recherche partielle dans le titre, la zone et l'identifiant de parcelle.
          schema: { type: string, maxLength: 120 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          description: Tri recent par defaut, ou prix croissant/decroissant.
          schema: { type: string, enum: [recent, price_asc, price_desc], default: recent }
      responses:
        '200':
          description: Page de biens publies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyPage' }
        '400': { $ref: '#/components/responses/Validation' }
    post:
      tags: [biens]
      summary: Creer un bien rattache a une parcelle (EF-301, RG-05, CA-5)
      description: |
        Role AGENT actif uniquement. Le bien est rattache a une parcelle par parcelId.
        Un client est refuse (403, "passez par un agent", CA-5). La publication (status PUBLIE)
        reste reservee a l'agent actif et est refusee si la parcelle est en litige ; les badges
        et le statut juridique sont relus a chaque lecture depuis Land. La certification
        agent est capturee a la publication ; Beni doit fournir un mecanisme de revocation
        avant qu'elle puisse etre consideree comme temps reel.
      x-confirmed-capabilities:
        - AGENT actif peut creer et publier un bien
        - CLIENT ne peut pas publier (CA-5)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyInput' }
      responses:
        '201':
          description: Bien cree
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Role insuffisant ou compte non actif (CA-5)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: FORBIDDEN
                message: Pour publier un bien, passez par un agent.
        '404': { $ref: '#/components/responses/NotFound' }

  /properties/mine:
    get:
      tags: [biens]
      summary: Lister ses propres biens (tous etats)
      description: |
        Role AGENT. Renvoie les biens de l'agent courant, y compris BROUILLON et RETIRE.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PropertyStatus' }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Page des biens de l'agent courant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /properties/{propertyId}:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
    get:
      tags: [biens]
      summary: Fiche publique d'un bien (EF-304)
      description: |
        Public. Consomme aussi par Leasing (GET /properties/:id) pour rattacher une visite.
        Un bien non publie (BROUILLON ou RETIRE) renvoie 404 pour le public. La fiche porte
        les badges, le statut juridique de la parcelle et le lien de verification.
      security: []
      responses:
        '200':
          description: Fiche du bien
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [biens]
      summary: Modifier ou retirer son bien
      description: |
        Role AGENT actif, auteur du bien (ou ADMIN actif pour le retirer).
        Permet de changer les champs et l'etat (publication / retrait). Un client et un
        agent non auteur recoivent 403. Une transition vers PUBLIE revalide la parcelle ;
        une parcelle en litige interdit la publication.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyUpdate' }
      responses:
        '200':
          description: Bien mis a jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /properties/{propertyId}/share:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
    get:
      tags: [partage]
      summary: Liens de partage d'un bien (EF-308)
      description: |
        Public. Renvoie le lien public du bien, le message WhatsApp pre-rempli et les
        elements "lien + image" pour TikTok et Instagram. Le bien doit etre PUBLIE.
      security: []
      responses:
        '200':
          description: Elements de partage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareLinks' }
        '404': { $ref: '#/components/responses/NotFound' }

  /properties/{propertyId}/photos:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
    post:
      tags: [photos]
      summary: Ajouter une photo publique a un bien
      description: |
        Role AGENT actif, auteur du bien. Photo de 5 Mio maximum, au format JPEG ou PNG.
        Les photos de biens sont publiques ; les pieces justificatives restent privees.
        Le fichier est conserve en PostgreSQL, et les octets sont controles par signature.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/PhotoUpload' }
      responses:
        '201':
          description: Photo ajoutee
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Photo' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /properties/{propertyId}/photos/{photoId}/content:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/PhotoId'
    get:
      tags: [photos]
      summary: Telecharger une photo d'un bien (public)
      description: Contenu public de la photo.
      security: []
      responses:
        '200':
          description: Image de la photo
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /properties/{propertyId}/photos/{photoId}:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
      - $ref: '#/components/parameters/PhotoId'
    delete:
      tags: [photos]
      summary: Supprimer une photo de son bien
      description: Agent actif auteur du bien. Si la photo principale est retiree, la photo la plus ancienne devient principale.
      security:
        - bearerAuth: []
      responses:
        '204': { description: Photo supprimee }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PropertyId:
      name: propertyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        description: Identifiant du bien.
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        description: Identifiant de la photo.

  schemas:
    PropertyType:
      type: string
      description: Type de bien (EF-301).
      enum: [TERRAIN, MAISON]

    TransactionType:
      type: string
      description: Vente ou location (vendre ou louer terrains et maisons).
      enum: [VENTE, LOCATION]

    PropertyStatus:
      type: string
      description: |
        Etat d'un bien. Seuls les biens PUBLIE sont visibles par le public.
        Un nouveau bien est BROUILLON. La publication exige un agent actif et une parcelle non EN_LITIGE.
      enum: [BROUILLON, PUBLIE, RETIRE]

    Currency:
      type: string
      description: Devise des prix. Le projet utilise le FCFA (XOF).
      enum: [XOF]
      default: XOF

    LegalStatus:
      type: string
      description: |
        Statut juridique de la parcelle rattachee. Meme enumeration que contracts/land.yaml ;
        lu depuis le statut public de la parcelle, jamais fixe par Listings.
      enum: [TITRE, COUTUMIER_NON_TITRE, EN_LITIGE, INCONNU]

    Badges:
      type: object
      description: Badges affiches sur l'annonce (EF-302, CA-6).
      required: [parcelCertified, agentCertified]
      properties:
        parcelCertified:
          type: boolean
          description: Vient de land GET /parcels/:id/status (champ certified).
        agentCertified:
          type: boolean
          description: Certification administrative fournie par auth ; false si auth ne la fournit pas.

    ParcelSnapshot:
      type: object
      description: |
        Resume public de la parcelle rattachee, sans donnee personnelle. Construit depuis
        contracts/land.yaml GET /parcels/:id/status. Le lien web de verification est
        /parcelle?id=<id>.
      required: [id, legalStatus, certified, approximateLocation]
      properties:
        id: { type: string, example: TG-AG3-00457 }
        legalStatus: { $ref: '#/components/schemas/LegalStatus' }
        certified: { type: boolean }
        areaM2: { type: number, description: Surface de la parcelle en metres carres. }
        approximateLocation:
          type: object
          description: |
            Point indicatif arrondi a 0,01 degre. Jamais une limite fonciere ni une borne ;
            ne pas l'utiliser comme reference de mesure ou de propriete.
          required: [latitude, longitude]
          properties:
            latitude: { type: number, minimum: -90, maximum: 90 }
            longitude: { type: number, minimum: -180, maximum: 180 }
        statusUrl:
          type: string
          description: Chemin API du statut public de la parcelle.
          example: /parcels/TG-AG3-00457/status

    Photo:
      type: object
      description: Photo publique d'un bien.
      required: [id, contentType, sizeBytes, url, uploadedAt, isPrimary]
      properties:
        id: { type: string, format: uuid }
        contentType: { type: string, enum: [image/jpeg, image/png] }
        sizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
        url:
          type: string
          description: Chemin de telechargement de la photo.
          example: /properties/8f3b6c2a-9e12-4c56-8a71-3b5e4a2c1d0f/photos/2d9a4c7e-1b3f-4a8d-9c6e-7f2b5a1d0c8e/content
        uploadedAt: { type: string, format: date-time }
        isPrimary: { type: boolean }

    PhotoUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Fichier de 5 Mio maximum, au format JPEG ou PNG.

    PropertyInput:
      type: object
      description: |
        Creation d'un bien.
        Le bien est rattache a une parcelle existante par parcelId.
      required: [parcelId, type, transaction, title, price]
      properties:
        parcelId:
          type: string
          description: Identifiant de la parcelle rattachee (format land TG-XXX-#####).
          example: TG-AG3-00457
        type: { $ref: '#/components/schemas/PropertyType' }
        transaction: { $ref: '#/components/schemas/TransactionType' }
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 4000 }
        price:
          type: integer
          minimum: 0
          description: Prix en FCFA (XOF). Pour une location, loyer par periode.
        currency: { $ref: '#/components/schemas/Currency' }
        pricePeriod:
          type: string
          description: Periode du loyer, obligatoire pour LOCATION et interdite pour VENTE.
          enum: [MOIS, AN]
        zone:
          type: string
          maxLength: 120
          description: Quartier ou localite du bien.
        status:
          allOf:
            - $ref: '#/components/schemas/PropertyStatus'
          description: Etat initial. Par defaut BROUILLON ; PUBLIE pour publier directement.

    PropertyUpdate:
      type: object
      description: Modification partielle d'un bien. Au moins un champ doit etre fourni.
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 4000 }
        price: { type: integer, minimum: 0 }
        currency: { $ref: '#/components/schemas/Currency' }
        pricePeriod:
          type: string
          enum: [MOIS, AN]
        zone: { type: string, maxLength: 120 }
        type: { $ref: '#/components/schemas/PropertyType' }
        transaction: { $ref: '#/components/schemas/TransactionType' }
        status: { $ref: '#/components/schemas/PropertyStatus' }

    Property:
      type: object
      description: Fiche complete d'un bien (EF-304).
      required: [id, parcelId, agentId, type, transaction, title, price, currency, status, badges, parcel, photos, createdAt]
      properties:
        id: { type: string, format: uuid }
        parcelId: { type: string, example: TG-AG3-00457 }
        agentId: { type: string, format: uuid, description: Compte agent auteur du bien. }
        type: { $ref: '#/components/schemas/PropertyType' }
        transaction: { $ref: '#/components/schemas/TransactionType' }
        title: { type: string }
        description: { type: string, nullable: true }
        price: { type: integer, minimum: 0 }
        currency: { $ref: '#/components/schemas/Currency' }
        pricePeriod:
          type: string
          enum: [MOIS, AN]
          nullable: true
        zone: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/PropertyStatus' }
        badges: { $ref: '#/components/schemas/Badges' }
        parcel: { $ref: '#/components/schemas/ParcelSnapshot' }
        photos:
          type: array
          items: { $ref: '#/components/schemas/Photo' }
        publicUrl:
          type: string
          nullable: true
          description: Lien public de la fiche (pour le partage, EF-308).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }

    PropertySummary:
      type: object
      description: Carte d'un bien dans une liste de recherche (EF-303).
      required: [id, parcelId, type, transaction, title, description, price, currency, status, badges, parcel]
      properties:
        id: { type: string, format: uuid }
        parcelId: { type: string, example: TG-AG3-00457 }
        type: { $ref: '#/components/schemas/PropertyType' }
        transaction: { $ref: '#/components/schemas/TransactionType' }
        title: { type: string }
        description: { type: string }
        price: { type: integer, minimum: 0 }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/PropertyStatus' }
        pricePeriod:
          type: string
          enum: [MOIS, AN]
          nullable: true
        zone: { type: string, nullable: true }
        badges: { $ref: '#/components/schemas/Badges' }
        parcel: { $ref: '#/components/schemas/ParcelSnapshot' }
        primaryPhotoUrl: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }

    PropertyPage:
      type: object
      description: Page de resultats paginee.
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PropertySummary' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }

    ShareLinks:
      type: object
      description: |
        Elements de partage (EF-308). WhatsApp fournit un message
        pre-rempli ; TikTok et Instagram fournissent un lien et une image.
      required: [publicUrl, whatsapp]
      properties:
        publicUrl:
          type: string
          description: Lien public de la fiche du bien.
        whatsapp:
          type: object
          required: [url, message]
          properties:
            url: { type: string, description: Lien wa.me avec message pre-rempli. }
            message: { type: string, description: Texte pre-rempli du message. }
        tiktok:
          type: object
          properties:
            url: { type: string }
            imageUrl: { type: string, nullable: true }
        instagram:
          type: object
          properties:
            url: { type: string }
            imageUrl: { type: string, nullable: true }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message:
          type: string
          description: Message lisible sans detail interne.
        details: { type: object }

  responses:
    Validation:
      description: Donnees de requete invalides
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: VALIDATION_ERROR
            message: Les donnees fournies sont invalides.
    Unauthorized:
      description: Jeton absent ou invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: UNAUTHORIZED
            message: Connexion requise.
    Forbidden:
      description: Role ou droit d'acces insuffisant (RG-05, CA-5)
      content:
        application/json:
