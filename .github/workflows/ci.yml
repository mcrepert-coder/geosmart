name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: geosmart
          POSTGRES_PASSWORD: test
          POSTGRES_DB: geosmart
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geosmart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://geosmart:test@localhost:5432/geosmart
      JWT_SECRET: secret-de-test-ci
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: test -f package.json && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - if: steps.present.outputs.ok == 'true'
        run: npm ci
      - if: steps.present.outputs.ok == 'true'
        run: npm run lint
      - if: steps.present.outputs.ok == 'true'
        run: npm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: test -f pubspec.yaml && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.ok == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: steps.present.outputs.ok == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - if: steps.present.outputs.ok == 'true'
        run: flutter pub get
      - if: steps.present.outputs.ok == 'true'
        run: flutter analyze
      - if: steps.present.outputs.ok == 'true'
        run: flutter test

  commits:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Messages de commit sans mention d'outil
        run: |
          if git log --format=%B "origin/${{ github.base_ref }}..HEAD" | grep -iE "co-authored-by|generated with"; then
            echo "Un message de commit contient une mention interdite."
            exit 1
          fi
